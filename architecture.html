    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script>
      const ARCHITECTURE_URL =
        'https://raw.githubusercontent.com/YasserElgammal/green-core/refs/heads/main/docs/architecture.md'

      const content = document.getElementById('architecture-content')

      function normalizeMarkdown(markdown) {
        const lines = markdown.split('\n')
        let insideFence = false

        for (let index = 0; index < lines.length; index += 1) {
          const line = lines[index]
          if (!/^\s*```/.test(line)) continue

          if (!insideFence) {
            const previousLine = lines[index - 1] || ''
            if (/^( {4,}|\t)/.test(previousLine) && /^\s*```\s*$/.test(line)) {
              let blockStart = index - 1
              while (blockStart > 0 && lines[blockStart - 1].trim() !== '') {
                blockStart -= 1
              }

              lines.splice(blockStart, 0, '```text')
              index += 1
              continue
            }
          }

          insideFence = !insideFence
        }

        return lines.join('\n')
      }

      function getGitHubDocumentUrl(rawUrl) {
        const url = new URL(rawUrl)
        const parts = url.pathname.split('/').filter(Boolean)
        const branchIndex = parts.indexOf('heads') + 1

        if (url.hostname !== 'raw.githubusercontent.com' || branchIndex === 0) {
          return rawUrl
        }

        const [owner, repository] = parts
        const branch = parts[branchIndex]
        const path = parts.slice(branchIndex + 1).join('/')
        return `https://github.com/${owner}/${repository}/blob/${branch}/${path}`
      }

      function getSvgContentBounds(svg) {
        const ignoredElements = new Set(['style', 'defs', 'title', 'desc'])
        let bounds = null

        for (const element of svg.children) {
          if (ignoredElements.has(element.tagName.toLowerCase()) || !element.getBBox) continue

          try {
            const box = element.getBBox()
            if (box.width <= 0 || box.height <= 0) continue

            if (!bounds) {
              bounds = { x: box.x, y: box.y, right: box.x + box.width, bottom: box.y + box.height }
              continue
            }

            bounds.x = Math.min(bounds.x, box.x)
            bounds.y = Math.min(bounds.y, box.y)
            bounds.right = Math.max(bounds.right, box.x + box.width)
            bounds.bottom = Math.max(bounds.bottom, box.y + box.height)
          } catch (error) {}
        }

        if (!bounds) return null
        return {
          x: bounds.x,
          y: bounds.y,
          width: bounds.right - bounds.x,
          height: bounds.bottom - bounds.y
        }
      }

      async function loadArchitecture() {
        try {
          const response = await fetch(ARCHITECTURE_URL)
          if (!response.ok) {
            throw new Error(`GitHub returned ${response.status}`)
          }

          const markdown = normalizeMarkdown(await response.text())
          content.innerHTML = marked.parse(markdown)

          content.querySelectorAll('a').forEach((link) => {
            const href = link.getAttribute('href')
            if (href && !href.startsWith('#')) {
              link.href = new URL(href, getGitHubDocumentUrl(ARCHITECTURE_URL)).href
            }

            if (link.origin !== window.location.origin) {
              link.target = '_blank'
              link.rel = 'noopener noreferrer'
            }
          })

          const mermaidBlocks = content.querySelectorAll('pre > code.language-mermaid')
          mermaidBlocks.forEach((code) => {
            const wrapper = document.createElement('div')
            wrapper.className = 'mermaid-scroll'

            const diagram = document.createElement('div')
            diagram.className = 'mermaid'
            diagram.textContent = code.textContent

            wrapper.appendChild(diagram)
            code.parentElement.replaceWith(wrapper)
          })

          mermaid.initialize({
            startOnLoad: false,
            theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'default',
            securityLevel: 'strict'
          })

          const diagrams = [...content.querySelectorAll('.mermaid')]
          for (const [index, diagram] of diagrams.entries()) {
            try {
              const source = diagram.textContent
              const result = await mermaid.render(`architecture-diagram-${index}`, source)
              diagram.innerHTML = result.svg
              if (result.bindFunctions) result.bindFunctions(diagram)

              const svg = diagram.querySelector('svg')
              const bounds = svg && getSvgContentBounds(svg)
              if (bounds && bounds.width > 0 && bounds.height > 0) {
                const padding = 24
                const width = bounds.width + padding * 2
                const height = bounds.height + padding * 2
                svg.setAttribute(
                  'viewBox',
                  `${bounds.x - padding} ${bounds.y - padding} ${width} ${height}`
                )
                svg.removeAttribute('height')
                svg.style.width = `${width}px`
                svg.style.aspectRatio = `${width} / ${height}`
                svg.style.height = 'auto'
              }
            } catch (error) {
              diagram.textContent = 'This diagram could not be rendered.'
            }
          }
        } catch (error) {
          content.innerHTML =
            '<p class="architecture-status error" role="alert">The architecture documentation could not be loaded from GitHub. Please try again later.</p>'
          console.error('Failed to load Green Core architecture:', error)
        }
      }

      loadArchitecture()
    </script>
